# Nom affiché dans l'onglet "Actions" de GitHub
name: CI

# Quand lancer la CI
on:
  pull_request:          # à chaque PR (ouverture et nouveau push dessus)
  push:
    branches: [main]     # et à chaque push sur main

jobs:
  # ---------- Job 1 : le frontend ----------
  frontend:
    runs-on: ubuntu-latest           # machine Linux prêtée par GitHub, vide au départ
    defaults:
      run:
        working-directory: frontend  # toutes les commandes "run" se lancent dans frontend/
    steps:
      # 1. Copier ton code sur la machine
      - uses: actions/checkout@v4

      # 2. Installer Node, et garder node_modules en cache entre deux CI
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Installer les dépendances exactement comme dans package-lock.json
      - run: npm ci

      # 4. Tes scripts de package.json
      - name: Lint
        run: npm run lint
      - name: Vérification des types
        run: npm run type-check
      - name: Build
        run: npm run build

  # ---------- Job 2 : le backend (tourne en parallèle du frontend) ----------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Vérification des types
        run: npm run type-check
      - name: Tests
        run: npm test

  # ---------- Job 3 : parcours joueur dans un vrai navigateur ----------
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend    # dossier par défaut de ce job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Le "|" permet d'écrire une valeur sur plusieurs lignes : un fichier par ligne
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Dépendances du frontend (dossier par défaut)
      - run: npm ci
      # Dépendances du backend : Playwright le démarre via webServer
      - run: npm ci
        working-directory: backend     # sur une étape, ça remplace le dossier par défaut

      # Chromium et les bibliothèques Linux dont il a besoin
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests Playwright
        run: npx playwright test